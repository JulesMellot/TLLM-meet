<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">Sondage de dates · TLLM*meet</title>
        <link id="icon" rel="icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta id="description" name="description" content="Indiquez vos disponibilités." />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />
        <link rel="stylesheet" href="../css/tllm-pages.css" />
        <link rel="stylesheet" href="../css/tllm-rdv.css" />
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/TllmRdv.js"></script>
    </head>
    <body class="tllm-page rdv-page">
        <main class="tllm-main">
            <div class="rdv-wrap" id="app">
                <a class="tllm-brand" href="/"><img src="../images/logo.svg" alt="" /><span>TLLM*meet</span></a>
                <p class="tllm-muted" id="loading">Chargement…</p>
                <section id="poll" class="rdv-stack" hidden></section>
            </div>
        </main>
        <div class="rdv-toast" id="toast" role="status" hidden></div>
        <footer class="tllm-footer">
            <a href="/privacy">Confidentialité</a>
            <a href="https://github.com/miroslavpejic85/mirotalksfu" target="_blank" rel="noopener noreferrer"

            >
