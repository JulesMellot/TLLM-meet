<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">TLLM*meet</title>
        <link id="icon" rel="icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta id="description" name="description" content="TLLM*meet, visioconférence privée." />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />
        <link rel="stylesheet" href="../css/tllm-pages.css" />
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/TllmHome.js"></script>
    </head>
    <body class="tllm-page">
        <main class="tllm-main">
            <div class="tllm-card">
                <a class="tllm-brand" href="/"><img src="../images/logo.svg" alt="" /><span>TLLM*meet</span></a>
                <section id="guestView">
                    <h1>Rejoindre une visio</h1>
                    <p>Pour participer, ouvrez le lien que l'organisateur vous a envoyé.</p>
                    <p class="tllm-muted"><a id="loginLink" href="/login">Espace organisateur</a></p>
                </section>
                <section id="adminView" hidden>
                    <h1>Nouvelle visio</h1>
                    <form id="newRoomForm" class="tllm-form">
                        <label for="roomName">Nom de la visio</label>
                        <input
                            id="roomName"
                            class="tllm-input"
                            type="text"
                            maxlength="40"
                            autocomplete="off"
                            placeholder="Point du lundi"
                        />
                        <button id="createRoomButton" class="tllm-button" type="submit">Créer la visio</button>
                        <p id="createRoomError" class="tllm-error" role="alert"></p>
                    </form>
                    <p class="tllm-muted">
                        Connecté : <span id="adminName"></span> · <a href="/logout">Se déconnecter</a>
                    </p>
                </section>
            </div>
        </main>
        <footer class="tllm-footer">
            <a href="/privacy">Confidentialité</a>
            <a href="https://github.com/miroslavpejic85/mirotalksfu" target="_blank" rel="noopener noreferrer"
                >Basé sur MiroTalk SFU</a
            >
        </footer>
    </body>
</html>
