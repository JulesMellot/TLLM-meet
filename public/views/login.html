<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">TLLM*meet</title>
        <link id="icon" rel="icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta id="description" name="description" content="TLLM*meet, visioconférence privée." />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />
        <link rel="stylesheet" href="../css/tllm-pages.css" />
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/Login.js"></script>
    </head>
    <body class="tllm-page">
        <main class="tllm-main">
            <div class="tllm-card">
                <a class="tllm-brand" href="/"><img src="../images/logo.svg" alt="" /><span>TLLM*meet</span></a>
                <h1 id="loginHeading">Espace organisateur</h1>
                <p id="loginDescription">Connectez-vous pour créer une visio.</p>
                <form id="loginForm" class="tllm-form">
                    <label for="username">Identifiant</label>
                    <input id="username" class="tllm-input" type="text" autocomplete="username" maxlength="254" required />
                    <label for="password">Mot de passe</label>
                    <input
                        id="password"
                        class="tllm-input"
                        type="password"
                        autocomplete="current-password"
                        maxlength="36"
                        required
                    />
                    <button id="loginButton" class="tllm-button" type="submit">Se connecter</button>
                    <p id="loginError" class="tllm-error" role="alert"></p>
                </form>
            </div>
        </main>
        <footer class="tllm-footer">
            <a href="/privacy">Confidentialité</a>
            <a href="https://github.com/miroslavpejic85/mirotalksfu" target="_blank" rel="noopener noreferrer"
                >Basé sur MiroTalk SFU</a
            >
        </footer>
    </body>
</html>
