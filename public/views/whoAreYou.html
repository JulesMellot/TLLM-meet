<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">TLLM*meet</title>
        <link id="icon" rel="icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta id="description" name="description" content="TLLM*meet, visioconférence privée." />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />
        <link rel="stylesheet" href="../css/tllm-pages.css" />
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/WhoAreYou.js"></script>
    </head>
    <body class="tllm-page">
        <main class="tllm-main">
            <div class="tllm-card">
                <a class="tllm-brand" href="/"><img src="../images/logo.svg" alt="" /><span>TLLM*meet</span></a>
                <h1 id="waitingRoomHeading">Cette visio n'a pas encore commencé</h1>
                <p id="waitingRoomDescription">
                    Gardez cette page ouverte : vous entrerez automatiquement dès que l'organisateur l'ouvrira.
                </p>
                <span id="waitingRoomName" class="tllm-chip" hidden></span>
                <div id="waitingState" class="tllm-status" aria-live="polite">
                    <span class="tllm-dot" aria-hidden="true"></span>
                    <span id="waitingStatus">En attente de l'organisateur…</span>
                </div>
                <p id="waitingElapsed" class="tllm-muted"></p>
                <p class="tllm-muted">
                    <span id="waitingRoomHostLink">Vous organisez cette visio ?</span>
                    <a id="waitingRoomLoginLink" href="/login">Se connecter</a>
                </p>
            </div>
        </main>
        <footer class="tllm-footer">
            <a href="/privacy">Confidentialité</a>
            <a href="https://github.com/miroslavpejic85/mirotalksfu" target="_blank" rel="noopener noreferrer"
                >Basé sur MiroTalk SFU</a
            >
        </footer>
    </body>
</html>
