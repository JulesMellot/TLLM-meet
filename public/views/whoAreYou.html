<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">TLLM*meet</title>
        <link id="icon" rel="icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />
        <meta id="description" name="description" content="TLLM*meet, visioconférence privée." />
        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{OG_TITLE}}" />
        <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
        <meta name="twitter:image" content="{{OG_IMAGE}}" />
        <link rel="stylesheet" href="../css/tllm-pages.css" />
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/TllmDoor.js"></script>
    </head>
    <body class="tllm-page">
        <header class="tllm-bar">
            <a class="tllm-mark" href="/">TLLM<span class="tllm-ast">*</span>meet</a>
        </header>
        <main class="tllm-main">
            <div class="tllm-door">
                <section class="tllm-sign" aria-labelledby="doorName">
                    <div class="tllm-band is-soon" id="doorBand" aria-live="polite">
                        <span id="doorState">Pas encore commencée</span>
                        <span class="tllm-band-clock" id="doorClock" aria-hidden="true"></span>
                    </div>
                    <div class="tllm-sign-body">
                        <h1 class="tllm-room-name" id="doorName">Visio</h1>
                        <dl class="tllm-facts" id="doorFacts"></dl>
                        <p class="tllm-sign-foot" id="doorFoot">Chargement…</p>
                    </div>
                </section>
                <section class="tllm-setup" aria-label="Vos réglages">
                    <div class="tllm-cam">
                        <video id="doorVideo" autoplay muted playsinline hidden></video>
                        <div class="tllm-cam-face" id="doorFace" aria-hidden="true">?</div>
                        <div class="tllm-cam-tools">
                            <button class="tllm-round" type="button" id="doorMic" aria-pressed="true"></button>
                            <button class="tllm-round" type="button" id="doorCam" aria-pressed="true"></button>
                        </div>
                    </div>
                    <label class="tllm-field" for="doorNameInput"
                        >Votre nom
                        <input
                            id="doorNameInput"
                            class="tllm-input"
                            type="text"
                            maxlength="60"
                            autocomplete="name"
                            placeholder="Votre prénom et nom"
                    /></label>
                    <label class="tllm-field" for="doorCamSelect" id="doorCamField" hidden
                        >Caméra
                        <select id="doorCamSelect" class="tllm-input"></select
                    ></label>
                    <label class="tllm-field" for="doorMicSelect" id="doorMicField" hidden
                        >Micro
                        <select id="doorMicSelect" class="tllm-input"></select
                    ></label>
                    <div class="tllm-level" aria-hidden="true">
                        <span>Micro</span>
                        <span class="tllm-level-track"><span class="tllm-level-fill" id="doorLevel"></span></span>
                    </div>
                    <div class="tllm-checks" id="doorChecks" aria-live="polite"></div>
                    <div class="tllm-enter">
                        <label class="tllm-check" id="doorAutoWrap"
                            ><input type="checkbox" id="doorAuto" checked /><span
                                >Entrer tout seul quand la salle ouvre</span
                            ></label
                        >
                        <button class="tllm-button" type="button" id="doorEnter" disabled>Entrer dans la salle</button>
                        <p class="tllm-error" id="doorError" role="alert"></p>
                    </div>
                </section>
            </div>
            <p class="tllm-hint" style="margin-top: 16px">
                Vous organisez cette visio ? <a id="doorLogin" href="/login">Se connecter</a>
            </p>
        </main>
        <footer class="tllm-footer">
            <a href="/privacy">Confidentialité</a>
            <a href="https://github.com/miroslavpejic85/mirotalksfu" target="_blank" rel="noopener noreferrer"
                >Basé sur MiroTalk SFU</a
            >
        </footer>
    </body>
</html>
