# TLLM*meet - déploiement Coolify (type de build « Docker Compose »)
#
# Coolify lit ce fichier et affiche les variables dans son interface :
#   - JWT_SECRET est généré par Coolify (SERVICE_PASSWORD_64_JWT) et conservé entre deux déploiements ;
#   - HOST_USERS et SERVER_HOST_URL sont obligatoires : le déploiement est bloqué tant qu'ils sont vides ;
#   - les autres variables ont une valeur par défaut, modifiable dans Coolify.
# La liste complète des variables est dans .env.template.

services:
    tllm-meet:
        build: .
        restart: unless-stopped
        # Port HTTP de l'application. Dans Coolify, le domaine du service s'écrit avec ce port :
        # https://meet.exemple.fr:3010 (Coolify route vers 3010, l'adresse publique reste sans port).
        expose:
            - '3010'
        ports:
            # Les flux audio et vidéo ne passent pas par Cloudflare : ces ports doivent être ouverts sur le serveur.
            - '40000-40100:40000-40100/udp'
            - '40000-40100:40000-40100/tcp'
        environment:
            - NODE_ENV=production
            # Adresse publique, sans port : https://meet.exemple.fr
            - SERVER_HOST_URL=${SERVER_HOST_URL:?}
            - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
            # Comptes admin : identifiant:motdepasse:Nom affiché, séparés par |
            - HOST_USERS=${HOST_USERS:?}
            - HOST_SESSION_HOURS=${HOST_SESSION_HOURS:-12}
            # Cloudflare + proxy Coolify
            - TRUST_PROXY=${TRUST_PROXY:-2}
            # Vide : l'IP publique est détectée au démarrage
            - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-}
            - SFU_MIN_PORT=40000
            - SFU_MAX_PORT=40100
            - UI_STYLE=${UI_STYLE:-sobre}
            - SOURCE_URL=${SOURCE_URL:-https://github.com/JulesMellot/TLLM-meet}
            # Fuseau des sondages de dates (« Caler une réunion »)
            - MEETING_TIMEZONE=${MEETING_TIMEZONE:-Europe/Paris}
        volumes:
            # Sondages de dates : gardés entre deux déploiements
            - tllm-data:/src/data

volumes:
    tllm-data:
